name: ticket-backend

services:
  tickets:
    build: .
    image: ticket-backend:local
    volumes:
      - ticket-data:/data

  api:
    build: .
    image: ticket-backend:local
    entrypoint: ["python", "-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    command: []
    environment:
      TICKETS_DATABASE: /data/tickets.db
    ports:
      - "127.0.0.1:${TICKETS_PORT:-8000}:8000"
    volumes:
      - ticket-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s

volumes:
  ticket-data:
